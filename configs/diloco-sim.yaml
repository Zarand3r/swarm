# Phase 1 DiLoCo, simulated M workers in one process (SimComm).
# Same model as the baseline so eval is comparable at equal total token budget.
seed: 1337
backend: sim
precision: bf16
batch_size: 32
token_budget: 100000000
eval_every: 1000
data_dir: data/tinystories
out_dir: results
model:
  n_layer: 8
  n_head: 8
  n_embd: 512
  block_size: 256
  dropout: 0.0
  bias: false
  attn_impl: flash
optim:
  inner_lr: 0.0006
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 200
  lr_schedule: cosine
  min_lr: 0.00006
diloco:
  H: 50
  M: 2
  outer_lr: 0.7
  outer_momentum: 0.9
  nesterov: true
